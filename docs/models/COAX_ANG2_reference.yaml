name: COAX_ANG2_reference
units:
  length: mm
  angle: deg
  potential: V
  temperature: K
grid:
  coordinates: cylindrical
  axes:
    r:
      to: 45.0
      boundaries: inf
    phi:
      from: 0
      to: 0
      boundaries:
        left: periodic
        right: periodic
    z:
      from: -5
      to: 112
      boundaries:
        left: inf
        right: inf
medium: vacuum
detectors:
- semiconductor:
    material: HPGe
    temperature: 78
    impurity_density:
      name: constant
      value: -5000000000.0cm^-3
    charge_drift_model:
      model: ADLChargeDriftModel
      phi110: 0°
      material: HPGe
      drift:
        velocity:
          model: Bruyneel2006
          parameters:
            e100:
              mu0: 38609cm^2/(V*s)
              beta: 0.805
              E0: 511V/cm
              mun: -171cm^2/(V*s)
            e111:
              mu0: 38536cm^2/(V*s)
              beta: 0.641
              E0: 538V/cm
              mun: 510cm^2/(V*s)
            h100:
              mu0: 61824cm^2/(V*s)
              beta: 0.942
              E0: 185V/cm
            h111:
              mu0: 61215cm^2/(V*s)
              beta: 0.662
              E0: 182V/cm
    geometry:
      polycone:
        r:
        - 5.0
        - 40.0
        - 40.0
        - 0
        - 0
        - 5.0
        - 5.0
        z:
        - 0
        - 0
        - 107
        - 107
        - 97
        - 97
        - 0
  contacts:
  - id: 1
    name: Readout p+
    material: HPGe
    potential: 0
    geometry:
      union:
      - tube:
          r:
            from: 5.0
            to: 5.0
          h: 97
          origin:
            z: 48.5
      - tube:
          r:
            from: 0
            to: 5.0
          h: 0
          origin:
            z: 97
  - id: 2
    name: Outer n+
    material: HPGe
    potential: 3500
    geometry:
      union:
      - tube:
          r:
            from: 40.0
            to: 40.0
          h: 107
          origin:
            z: 53.5
      - tube:
          r:
            from: 0
            to: 40.0
          h: 0
          origin:
            z: 107
      - tube:
          r:
            from: 8.0
            to: 40.0
          h: 0
          origin:
            z: 0
