name: GeRC02
units:
  length: mm
  angle: deg
  potential: V
  temperature: K
grid:
  coordinates: cylindrical
  axes:
    r:
      to: 15
      boundaries: inf
    phi:
      from: 0
      to: 0
      boundaries:
        left: periodic
        right: periodic
    z:
      from: -2
      to: 22
      boundaries:
        left: inf
        right: inf
  spacing_surface_refinement:
  - 1e-4
  - 1e-4
  - 1e-4
medium: vacuum
detectors:
- semiconductor:
    material: HPGe
    temperature: 78
    impurity_density:
      name: PtypePNjunction
      lithium_annealing_temperature: 553.15K
      lithium_annealing_time: 30minute
      doped_contact_id: 2
      bulk_impurity_density:
        name: constant
        value: -1.05e10cm^-3
    charge_drift_model:
      model: InactiveLayerChargeDriftModel
      temperature: 78K
      neutral_impurity_density:
        name: constant
        value: 5.6769e15cm^-3
    charge_trapping_model:
      model: ConstantLifetime
      parameters:
        τh: 1ms
        τe: 1ms
      model_inactive: ConstantLifetime
      parameters_inactive:
        τh: 1μs
        τe: 1μs
    geometry:
      polycone:
        r:
        - 5.62
        - 12.16
        - 12.16
        - 11.98
        - 11.98
        - 12.16
        - 12.16
        - 5.62
        - 5.62
        z:
        - 0
        - 0
        - 5.66
        - 9.25
        - 11.25
        - 14.84
        - 20.5
        - 20.5
        - 0
  contacts:
  - name: ring contact
    material: HPGe
    id: 1
    potential: 0
    geometry:
      tube:
        r:
          from: 11.98
          to: 11.98
        h: 1.3
        origin:
          z: 10.25
  - name: Lithium Contact
    material: HPGe
    id: 2
    potential: 240
    geometry:
      union:
      - tube:
          r:
            from: 5.62
            to: 5.62
          h: 20.5
          origin:
            z: 10.25
      - tube:
          r:
            from: 5.62
            to: 12.16
          h: 0
          origin:
            z: 0
      - tube:
          r:
            from: 5.62
            to: 12.16
          h: 0
          origin:
            z: 20.5
      - tube:
          r:
            from: 12.16
            to: 12.16
          h: 2
          origin:
            z: 19.5
      - tube:
          r:
            from: 12.16
            to: 12.16
          h: 2
          origin:
            z: 1
