name: AK01
units:
  length: mm
  angle: deg
  potential: V
  temperature: K
grid:
  coordinates: cylindrical
  axes:
    r:
      to: 15
      boundaries: inf
    phi:
      from: 0
      to: 0
      boundaries:
        left: periodic
        right: periodic
    z:
      from: -2
      to: 11
      boundaries:
        left: inf
        right: inf
  spacing_surface_refinement:
  - 1e-4
  - 1e-4
  - 1e-4
medium: vacuum
detectors:
- semiconductor:
    material: HPGe
    temperature: 78
    impurity_density:
      name: PtypePNjunction
      lithium_annealing_temperature: 553.15K
      lithium_annealing_time: 30minute
      doped_contact_id: 2
      bulk_impurity_density:
        name: constant
        value: -1.70e10cm^-3
    charge_drift_model:
      model: InactiveLayerChargeDriftModel
      temperature: 78K
      neutral_impurity_density:
        name: constant
        value: 5.6769e15cm^-3
    charge_trapping_model:
      model: ConstantLifetime
      parameters:
        τh: 1ms
        τe: 1ms
      model_inactive: ConstantLifetime
      parameters_inactive:
        τh: 1μs
        τe: 1μs
    geometry:
      polycone:
        r:
        - 0
        - 6.15
        - 6.15
        - 12.45
        - 12.45
        - 7.55
        - 7.55
        - 3.55
        - 3.55
        - 0
        - 0
        z:
        - 2.2
        - 2.2
        - 0
        - 0
        - 8.2
        - 8.2
        - 6.7
        - 6.7
        - 8.2
        - 8.2
        - 2.2
  contacts:
  - name: point contact
    material: HPGe
    id: 1
    potential: 0
    geometry:
      tube:
        r:
          from: 0
          to: 0.75
        h: 0.01
        origin:
          z: 8.205
  - name: Lithium Contact
    material: HPGe
    id: 2
    potential: 700
    geometry:
      union:
      - tube:
          r:
            from: 0
            to: 6.15
          h: 0
          origin:
            z: 2.2
      - tube:
          r:
            from: 6.15
            to: 6.15
          h: 2.2
          origin:
            z: 1.1
      - tube:
          r:
            from: 6.15
            to: 12.45
          h: 0
          origin:
            z: 0
      - tube:
          r:
            from: 12.45
            to: 12.45
          h: 8.2
          origin:
            z: 4.1
      - tube:
          r:
            from: 7.55
            to: 12.45
          h: 0
          origin:
            z: 8.2
